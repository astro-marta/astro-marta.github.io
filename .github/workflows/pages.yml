name: Publish personal website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Verify website files
        run: node --check script.js && node scripts/verify.mjs
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prepare website
        run: |
          mkdir -p _site/assets
          cp index.html styles.css script.js .nojekyll SOURCES.md _site/
          cp assets/*.webp assets/*.svg assets/*.ttf assets/*.txt assets/social-card.jpg _site/assets/
          for file in sitemap.xml robots.txt; do
            if [ -f "$file" ]; then cp "$file" _site/; fi
          done
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
